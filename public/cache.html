<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi caché · Duan CDN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; background: #050607; color: #e7ecf3;
    font-family: 'Inter', sans-serif; padding: 40px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .back-link {
    color: #4d8cff; font-size: 12.5px; text-decoration: none; border: 1px solid #1c2733;
    padding: 6px 12px; border-radius: 6px; background: #0b0e14;
  }
  .back-link:hover { background: #0f141d; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #8a94a3; font-size: 13px; margin: 0 0 24px; }
  .empty { color: #6b7686; font-size: 13px; text-align: center; padding: 40px 0; }
  .item {
    background: #0b0e14; border: 1px solid #1c2733; border-radius: 8px;
    padding: 14px; margin-bottom: 14px;
  }
  .item-media img, .item-media video, .item-media audio {
    width: 100%; border-radius: 6px; display: block;
  }
  .item-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; font-size: 11px; color: #6b7686;
  }
  .item-actions { display: flex; gap: 8px; margin-top: 10px; }
  .item-actions button {
    flex: 1; background: #1c2733; color: #e7ecf3; border: 1px solid #2a3646;
    padding: 7px 10px; border-radius: 5px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .item-actions button.copy.copied { background: #1d4ed8; border-color: #1d4ed8; }
  .item-actions button.delete { background: #2a1414; border-color: #4a1f1f; color: #e0837a; }
  .item-actions button.delete:hover { background: #341717; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Mi caché</h1>
    <a class="back-link" href="/">Subir</a>
  </div>
  <p class="sub">Tus archivos se borran solos a las 24 horas de subidos</p>

  <div id="list"></div>
</div>

<script>
function getUid() {
  let uid = localStorage.getItem('duan_uid');
  if (!uid) {
    uid = crypto.randomUUID();
    localStorage.setItem('duan_uid', uid);
  }
  return uid;
}

function timeLeft(expiresAt) {
  const ms = new Date(expiresAt).getTime() - Date.now();
  if (ms <= 0) return 'a punto de borrarse';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  return `se borra en ${h}h ${m}m`;
}

function renderMedia(file) {
  if (file.mimetype && file.mimetype.startsWith('video/')) {
    return `<video src="${file.url}" controls></video>`;
  }
  if (file.mimetype && file.mimetype.startsWith('audio/')) {
    return `<audio src="${file.url}" controls></audio>`;
  }
  return `<img src="${file.url}">`;
}

async function load() {
  const uid = getUid();
  const list = document.getElementById('list');

  const res = await fetch(`/my-files?uid=${encodeURIComponent(uid)}`);
  const data = await res.json();

  if (!data.status) {
    list.innerHTML = `<div class="empty">Error: ${data.error}</div>`;
    return;
  }

  if (!data.files.length) {
    list.innerHTML = '<div class="empty">Todavía no subiste nada.</div>';
    return;
  }

  list.innerHTML = data.files.map((file, i) => `
    <div class="item">
      <div class="item-media">${renderMedia(file)}</div>
      <div class="item-meta">
        <span>${timeLeft(file.expiresAt)}</span>
      </div>
      <div class="item-actions">
        <button class="copy" data-url="${file.url}">Copiar link</button>
        <button class="delete" data-filename="${file.filename}">Eliminar</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.copy').forEach((btn) => {
    btn.addEventListener('click', () => {
      navigator.clipboard.writeText(btn.dataset.url);
      btn.textContent = 'Copiado';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copiar link';
        btn.classList.remove('copied');
      }, 1500);
    });
  });

  list.querySelectorAll('.delete').forEach((btn) => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'Eliminando...';
      await fetch(`/my-files/${btn.dataset.filename}?uid=${encodeURIComponent(uid)}`, { method: 'DELETE' });
      load();
    });
  });
}

load();
</script>
</body>
</html>
