<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duan CDN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; background: #050607; color: #e7ecf3;
    font-family: 'Inter', sans-serif; padding: 40px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cache-link {
    color: #4d8cff; font-size: 12.5px; text-decoration: none; border: 1px solid #1c2733;
    padding: 6px 12px; border-radius: 6px; background: #0b0e14;
  }
  .cache-link:hover { background: #0f141d; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #8a94a3; font-size: 13px; margin: 0 0 24px; }
  .card { background: #0b0e14; border: 1px solid #1c2733; border-radius: 8px; padding: 20px; }
  input[type="file"] {
    width: 100%; background: #05070a; border: 1px solid #1c2733; color: #e7ecf3;
    padding: 10px; border-radius: 6px; font-size: 12.5px; margin-bottom: 12px;
  }
  button {
    background: #1d4ed8; color: #fff; border: none; padding: 10px 16px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  }
  button:hover { background: #1e40af; }
  .file-info {
    display: none; align-items: center; gap: 10px;
    background: #05070a; border: 1px solid #1c2733; border-radius: 6px;
    padding: 9px 10px; margin-bottom: 12px; font-size: 12px;
  }
  .file-info .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e7ecf3; }
  .file-info .size { color: #6b7686; flex-shrink: 0; }
  .file-info .remove {
    background: #1c2733; color: #e7ecf3; border: none; width: 20px; height: 20px;
    border-radius: 50%; font-size: 13px; line-height: 1; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .file-info .remove:hover { background: #2a1414; color: #e0837a; }
  .result { margin-top: 16px; font-size: 12px; }
  .link-row {
    display: flex; align-items: center; gap: 8px;
    background: #05070a; border: 1px solid #1c2733; border-radius: 6px;
    padding: 10px 12px; margin-bottom: 4px;
  }
  .link-row span { flex: 1; min-width: 0; word-break: break-all; color: #e7ecf3; }
  .copy-btn {
    background: #1c2733; color: #e7ecf3; border: 1px solid #2a3646;
    padding: 6px 12px; border-radius: 5px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; flex-shrink: 0; width: auto;
  }
  .copy-btn:hover { background: #263140; }
  .copy-btn.copied { background: #1d4ed8; border-color: #1d4ed8; }
  img, video, audio { max-width: 100%; width: 100%; border-radius: 6px; margin-top: 14px; border: 1px solid #1c2733; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Duan CDN</h1>
    <a class="cache-link" href="/cache">Mi caché</a>
  </div>
  <p class="sub">Subida de imágenes con almacenamiento permanente en DuanX</p>

  <div class="card">
    <input type="file" id="fileInput" accept="image/*,video/*,audio/*">
    <div class="file-info" id="fileInfo">
      <span class="name" id="fileInfoName"></span>
      <span class="size" id="fileInfoSize"></span>
      <button class="remove" id="fileInfoRemove">&times;</button>
    </div>
    <button id="uploadBtn">Subir</button>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
function getUid() {
  let uid = localStorage.getItem('duan_uid');
  if (!uid) {
    uid = crypto.randomUUID();
    localStorage.setItem('duan_uid', uid);
  }
  return uid;
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const fileInfoName = document.getElementById('fileInfoName');
const fileInfoSize = document.getElementById('fileInfoSize');
const fileInfoRemove = document.getElementById('fileInfoRemove');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) {
    fileInfo.style.display = 'none';
    return;
  }
  fileInfoName.textContent = file.name;
  fileInfoSize.textContent = formatSize(file.size);
  fileInfo.style.display = 'flex';
  document.getElementById('result').innerHTML = '';
});

fileInfoRemove.addEventListener('click', () => {
  fileInput.value = '';
  fileInfo.style.display = 'none';
  document.getElementById('result').innerHTML = '';
});

const MAX_AUDIO_SECONDS = 20 * 60;

function getMediaDuration(file) {
  return new Promise((resolve, reject) => {
    const el = document.createElement(file.type.startsWith('video/') ? 'video' : 'audio');
    el.preload = 'metadata';
    el.onloadedmetadata = () => {
      URL.revokeObjectURL(el.src);
      resolve(el.duration);
    };
    el.onerror = () => reject(new Error('No se pudo leer la duración'));
    el.src = URL.createObjectURL(file);
  });
}

document.getElementById('uploadBtn').addEventListener('click', async () => {
  const input = document.getElementById('fileInput');
  const result = document.getElementById('result');

  if (!input.files[0]) {
    result.innerHTML = 'Elegí un archivo primero.';
    return;
  }

  const file = input.files[0];

  if (file.type.startsWith('audio/')) {
    try {
      const duration = await getMediaDuration(file);
      if (duration > MAX_AUDIO_SECONDS) {
        const mins = Math.floor(duration / 60);
        const secs = Math.round(duration % 60);
        result.innerHTML = `El audio dura ${mins}:${secs.toString().padStart(2, '0')}, el límite es 20:00.`;
        return;
      }
    } catch {
      result.innerHTML = 'No se pudo leer la duración del audio.';
      return;
    }
  }

  result.innerHTML = 'Subiendo...';

  const formData = new FormData();
  formData.append('file', file);
  formData.append('uid', getUid());

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();

    if (!data.status) {
      result.innerHTML = 'Error: ' + data.error;
      return;
    }

    let preview;
    if (file.type.startsWith('video/')) {
      preview = `<video src="${data.urlPropia}" controls></video>`;
    } else if (file.type.startsWith('audio/')) {
      preview = `<audio src="${data.urlPropia}" controls></audio>`;
    } else {
      preview = `<img src="${data.urlPropia}">`;
    }

    result.innerHTML = `
      <div class="link-row">
        <span id="linkText">${data.urlPropia}</span>
        <button class="copy-btn" id="copyBtn">Copiar</button>
      </div>
      ${preview}
    `;

    document.getElementById('copyBtn').addEventListener('click', () => {
      const btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(data.urlPropia);
      btn.textContent = 'Copiado';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = 'Copiar';
        btn.classList.remove('copied');
      }, 1500);
    });
  } catch (err) {
    result.innerHTML = 'Error: ' + err.message;
  }
});
</script>
</body>
</html>
